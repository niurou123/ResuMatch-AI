name: 功能建议
description: 提出新功能或改进建议
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先查看 [README 的路线图](https://github.com/niurou123/ResuMatch-AI#路线图)，避免与已规划项重复。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景与痛点，而不是直接给出实现方案
      placeholder: 在网申页面遇到多步骤表单时，第一页填完后跳转第二页需要重新扫描……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法，以及为什么没选它们

  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 简历解析
        - 检索增强
        - 多 Agent 编排
        - 前端界面
        - Chrome 扩展
        - 评测体系
        - 文档
    validations:
      required: true

  - type: checkboxes
    id: willing
    attributes:
      label: 是否愿意提交 PR
      options:
        - label: 我可以实现这个功能
        - label: 我可以协助测试
