<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简历编辑器 — ResuMatch</title>
<style>
  :root {
    --bg: #09090b; --surface: #18181b; --surface2: #27272a;
    --border: #3f3f46; --border-light: #52525b;
    --text: #fafafa; --text2: #a1a1aa; --text3: #71717a;
    --primary: #6366f1; --primary-hover: #818cf8;
    --success: #22c55e; --warn: #f59e0b; --danger: #ef4444;
    --radius-sm: 6px; --radius: 8px; --radius-lg: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Microsoft YaHei",sans-serif;
    font-size:13px;background:var(--bg);color:var(--text);min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* Header */
  .header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 24px;border-bottom:1px solid var(--border);
    background:rgba(9,9,11,.85);backdrop-filter:blur(8px);
    position:sticky;top:0;z-index:10;
  }
  .brand{display:flex;align-items:center;gap:8px}
  .brand-icon{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
  .brand-name{font-weight:600;font-size:14px;letter-spacing:-0.01em}
  .brand-sub{font-size:11px;color:var(--text3)}

  .btn{
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid transparent;border-radius:var(--radius-sm);
    font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;
    font-family:inherit;padding:8px 14px;
  }
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 1px 3px rgba(99,102,241,.2)}
  .btn-primary:hover{background:var(--primary-hover)}
  .btn-outline{background:transparent;color:var(--text2);border-color:var(--border)}
  .btn-outline:hover{background:var(--surface);color:var(--text)}

  /* Layout */
  .layout{display:grid;grid-template-columns:180px 1fr;min-height:calc(100vh - 53px)}
  @media(max-width:800px){.layout{grid-template-columns:120px 1fr}}

  /* Sidebar nav */
  .nav{
    border-right:1px solid var(--border);padding:12px 8px;
    position:sticky;top:53px;align-self:start;max-height:calc(100vh - 53px);overflow-y:auto;
    display:flex;flex-direction:column;gap:6px;
  }
  .nav-btn{
    width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);
    background:var(--surface);padding:10px 10px;text-align:left;cursor:pointer;
    font:inherit;color:inherit;transition:all .15s;
    display:flex;flex-direction:column;gap:2px;
  }
  .nav-btn:hover{border-color:var(--border-light);background:var(--surface2)}
  .nav-btn.active{border-color:var(--primary);background:var(--surface2);box-shadow:var(--shadow)}
  .nav-label{font-size:12px;font-weight:600}
  .nav-meta{font-size:10px;color:var(--text3)}

  /* Content */
  .content{padding:20px 24px;overflow-y:auto;max-width:800px}
  .section{margin-bottom:24px}

  /* Section card */
  .section-card{
    border:1px solid var(--border);border-radius:var(--radius-lg);
    background:var(--surface);overflow:hidden;
  }
  .section-head{
    padding:14px 18px;border-bottom:1px solid var(--border);
    background:var(--surface2);display:flex;align-items:center;justify-content:space-between;
  }
  .section-title{font-size:13px;font-weight:600;color:var(--text2)}
  .section-summary{font-size:11px;color:var(--text3);margin-top:2px}
  .section-body{padding:18px;display:flex;flex-direction:column;gap:14px}
  .section-body.is-collapsed{display:none}
  .section-toggle{cursor:pointer;color:var(--text3);font-size:12px;transition:transform .2s}
  .section.is-collapsed .section-toggle{transform:rotate(-90deg)}
  .section.is-collapsed .section-head{border-bottom:none}

  /* Fields */
  .fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:600px){.fields-grid{grid-template-columns:1fr}}
  .field-full{grid-column:1/-1}
  .form-group{display:flex;flex-direction:column;gap:5px}
  .form-group label{font-size:11px;font-weight:500;color:var(--text3)}
  .input,.select,.textarea{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);
    font-size:12px;color:var(--text);background:var(--bg);transition:all .15s;
    font-family:inherit;
  }
  .textarea{min-height:80px;resize:vertical;line-height:1.6}
  .input:focus,.select:focus,.textarea:focus{
    outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(99,102,241,.15);
  }
  .input::placeholder,.textarea::placeholder{color:var(--text3)}

  /* Slot (list item) */
  .slot{
    border:1px solid var(--border);border-radius:var(--radius);padding:14px;
    background:rgba(24,24,27,.5);margin-bottom:12px;
  }
  .slot-head{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
  }
  .slot-title{font-size:11px;font-weight:600;color:var(--text2)}

  /* Tip */
  .tip{
    padding:10px 14px;border:1px dashed var(--border);background:var(--surface);
    border-radius:var(--radius);color:var(--text3);font-size:11px;line-height:1.6;margin-bottom:16px;
  }

  .text-secondary{color:var(--text3);font-size:11px}
  .mt-12{margin-top:12px}
</style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="brand-icon"></div>
      <div>
        <div class="brand-name">ResuMatch</div>
        <div class="brand-sub">简历编辑器 — 数据保存到本地，与填表流程同步</div>
      </div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-outline" id="btnReset">重置</button>
      <button class="btn btn-primary" id="btnSave">保存档案</button>
    </div>
  </header>

  <div class="layout">
    <nav class="nav" id="sectionNav"></nav>
    <main class="content" id="sectionContent">
      <div class="tip">正在加载档案数据...</div>
    </main>
  </div>

  <script src="lib/resume-schema.js"></script>
  <script src="lib/template.js"></script>
  <script src="resume-editor.js"></script>
</body>
</html>
