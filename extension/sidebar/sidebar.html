<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResuMatch</title>
<style>
  :root {
    --bg: #09090b; --surface: #18181b; --surface2: #27272a;
    --border: #3f3f46; --border-light: #52525b;
    --text: #fafafa; --text2: #a1a1aa; --text3: #71717a;
    --primary: #6366f1; --primary-hover: #818cf8;
    --success: #22c55e; --warn: #f59e0b; --danger: #ef4444;
    --radius-sm: 6px; --radius: 8px; --radius-lg: 12px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Microsoft YaHei",sans-serif;
    font-size:13px;background:var(--bg);color:var(--text);min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* Header */
  .header{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;border-bottom:1px solid var(--border);
    background:rgba(9,9,11,0.85);backdrop-filter:blur(8px);
    position:sticky;top:0;z-index:10;
  }
  .brand{display:flex;align-items:center;gap:8px}
  .brand-icon{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
  .brand-name{font-weight:600;font-size:13px;letter-spacing:-0.01em}

  /* Status badge */
  .status-badge{
    display:inline-flex;align-items:center;gap:6px;padding:3px 10px;
    border-radius:100px;font-size:11px;font-weight:500;border:1px solid transparent;
  }
  .status-badge.on{background:rgba(34,197,94,0.08);color:#22c55e;border-color:rgba(34,197,94,0.2)}
  .status-badge.off{background:rgba(239,68,68,0.08);color:#ef4444;border-color:rgba(239,68,68,0.2)}
  .status-dot{width:5px;height:5px;border-radius:50%}
  .status-badge.on .status-dot{background:var(--success);box-shadow:0 0 4px rgba(34,197,94,0.4)}
  .status-badge.off .status-dot{background:var(--danger)}

  /* Tabs */
  .tabs{
    display:flex;gap:4px;padding:3px;margin:12px 16px;
    border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);
  }
  .tab{
    flex:1;border:none;background:transparent;color:var(--text3);
    font-size:12px;font-weight:500;padding:7px 10px;border-radius:var(--radius-sm);
    cursor:pointer;transition:all .15s;font-family:inherit;
  }
  .tab:hover{color:var(--text2)}
  .tab.active{background:var(--bg);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.3)}

  /* Panel */
  .panel{display:none;padding:0 16px 16px;flex-direction:column;gap:14px}
  .panel.active{display:flex}

  /* Tip */
  .tip{
    padding:10px 12px;border:1px dashed var(--border);background:var(--surface);
    border-radius:var(--radius);color:var(--text3);font-size:11px;line-height:1.6;
  }

  /* Buttons */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:6px;
    border:1px solid transparent;border-radius:var(--radius-sm);
    font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;
    font-family:inherit;padding:9px 14px;
  }
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 1px 3px rgba(99,102,241,.2)}
  .btn-primary:hover:not(:disabled){background:var(--primary-hover);transform:translateY(-1px)}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
  .btn-outline:hover{background:var(--surface);border-color:var(--border-light)}
  .btn-danger{background:rgba(239,68,68,.08);color:var(--danger);border-color:rgba(239,68,68,.15)}
  .btn-danger:hover{background:rgba(239,68,68,.12)}
  .btn-sm{padding:6px 10px;font-size:11px}
  .btn-block{width:100%}

  /* Stats */
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat-card{
    padding:12px 8px;border-radius:var(--radius);border:1px solid var(--border);
    text-align:center;transition:border-color .15s;
  }
  .stat-card:hover{border-color:var(--border-light)}
  .stat-value{font-size:20px;font-weight:600;letter-spacing:-0.02em;line-height:1.2}
  .stat-label{font-size:10px;color:var(--text3);margin-top:3px}

  /* Section card */
  .section-card{
    border:1px solid var(--border);border-radius:var(--radius-lg);
    background:var(--surface);overflow:hidden;
  }
  .section-head{
    padding:12px 14px;border-bottom:1px solid var(--border);
    background:var(--surface2);display:flex;align-items:center;justify-content:space-between;
  }
  .section-head .title{font-size:12px;font-weight:600;color:var(--text2)}
  .section-body{padding:12px 14px;display:flex;flex-direction:column;gap:10px}

  /* Resume nav */
  .resume-nav{display:flex;flex-direction:column;gap:6px}
  .nav-btn{
    width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);
    background:var(--surface);padding:9px 10px;text-align:left;cursor:pointer;
    font:inherit;color:inherit;transition:all .15s;
    display:flex;justify-content:space-between;align-items:center;
  }
  .nav-btn:hover{border-color:var(--border-light);background:var(--surface2)}
  .nav-btn.active{border-color:var(--primary);background:var(--surface2)}
  .nav-label{font-size:11px;font-weight:500}
  .nav-dot{width:6px;height:6px;border-radius:50%}
  .nav-dot.filled{background:var(--success)}
  .nav-dot.empty{background:var(--border)}

  /* Forms */
  .form-group{margin-bottom:6px}
  .form-group label{display:block;font-size:11px;font-weight:500;color:var(--text3);margin-bottom:4px}
  .input, .select, .textarea{
    width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);
    font-size:12px;color:var(--text);background:var(--bg);transition:all .15s;
    font-family:inherit;
  }
  .textarea{min-height:64px;resize:vertical;line-height:1.6}
  .input:focus, .select:focus, .textarea:focus{
    outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(99,102,241,.15);
  }

  /* Tags */
  .tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:500}
  .tag.ok{background:rgba(34,197,94,.1);color:var(--success)}
  .tag.err{background:rgba(239,68,68,.1);color:var(--danger)}
  .tag.info{background:rgba(99,102,241,.1);color:var(--primary-hover)}

  /* Row */
  .row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:11px}
  .row .label{color:var(--text3)}

  .hidden{display:none!important}
  .text-secondary{color:var(--text3);font-size:11px}
</style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="brand-icon"></div>
      <span class="brand-name">ResuMatch</span>
    </div>
    <div id="statusBadge" class="status-badge off">
      <span class="status-dot"></span>
      <span>离线</span>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="resume">简历</button>
    <button class="tab" data-tab="profile">档案</button>
    <button class="tab" data-tab="apply">网申</button>
  </div>

  <!-- 简历上传 -->
  <div id="panel-resume" class="panel active">
    <div class="tip">上传简历文件，AI 自动提取结构化数据到本地档案。支持 PDF、DOCX、MD、TXT。</div>
    <input type="file" id="fileInput" accept=".docx,.pdf,.md,.txt" style="color:var(--text2);font-size:11px">
    <button class="btn btn-primary btn-block" id="btnUpload">上传并解析</button>
    <div id="parseStatus" class="hidden"></div>
  </div>

  <!-- 档案编辑 -->
  <div id="panel-profile" class="panel">
    <div class="tip">已提取的档案数据，可编辑后保存到本地。完整编辑请打开独立编辑器。</div>
    <div class="stats-grid" id="profileStats"></div>
    <button class="btn btn-outline btn-block btn-sm" id="btnOpenEditor">在独立页面中编辑完整档案</button>
    <div id="profileNav" class="resume-nav"></div>
    <div id="profileForm"></div>
    <button class="btn btn-primary btn-block hidden" id="btnSaveProfile">保存修改</button>
  </div>

  <!-- 网申填充 -->
  <div id="panel-apply" class="panel">
    <button class="btn btn-primary btn-block" id="btnScan">扫描当前页面表单</button>
    <div id="scanPreview"></div>
    <button class="btn btn-primary btn-block hidden" id="btnFill">一键智能填充</button>
    <button class="btn btn-danger btn-block hidden" id="btnClear">清空填充</button>
    <div id="fillResult"></div>
  </div>

  <script src="../lib/resume-schema.js"></script>
  <script src="../lib/template.js"></script>
  <script src="../lib/api.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
