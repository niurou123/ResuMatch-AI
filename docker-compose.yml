version: '3.8'

services:
  # FastAPI 后端
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interview-rag-api
    ports:
      - "8000:8000"
    environment:
      # DeepSeek API Key 走宿主 .env（docker compose 自动读取同目录 .env）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      # Redis 走 compose 网络内的服务名，而非宿主 localhost
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: python -m src.api.main
    depends_on:
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - interview-rag
    healthcheck:
      # 路由前缀是 /api/v1，根路径没有 /health
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React 前端 (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: interview-rag-frontend
    ports:
      - "3000:80"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - interview-rag

  # 可选：Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: interview-rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - interview-rag

volumes:
  redis_data:

networks:
  interview-rag:
    driver: bridge
